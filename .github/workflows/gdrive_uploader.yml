name: Remote Music Zip Extractor to Google Drive

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: 'Direct URL to the 1.1GB ZIP file'
        required: true
        type: string

jobs:
  process-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-auth google-api-python-client requests

    - name: Run Script
      env:
        GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      run: |
        python upload_and_extract.py "${{ github.event.inputs.download_url }}"
